<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Left film strip -->
  <rect x="8" y="0" width="14" height="100" fill="#12121f"/>
  <rect x="10" y="8"  width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="22" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="36" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="50" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="64" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="78" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="10" y="92" width="10" height="7" rx="1" fill="#2d2d4e"/>

  <!-- Right film strip -->
  <rect x="78" y="0" width="14" height="100" fill="#12121f"/>
  <rect x="80" y="8"  width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="22" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="36" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="50" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="64" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="78" width="10" height="7" rx="1" fill="#2d2d4e"/>
  <rect x="80" y="92" width="10" height="7" rx="1" fill="#2d2d4e"/>

  <!-- FC letters -->
  <text x="36" y="67" text-anchor="middle" font-size="46" font-weight="900" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">F</text>
  <text x="62" y="67" text-anchor="middle" font-size="46" font-weight="900" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">C</text>

  <!-- Underline accent -->
  <rect x="28" y="70" width="44" height="3" rx="1.5" fill="#7c3aed"/>
</svg>
