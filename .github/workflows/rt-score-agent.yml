name: RT Score Agent

on:
  schedule:
    # Runs every Thursday at 6am UTC (ahead of Friday wide releases)
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      film_title:
        description: 'Single film title (leave blank to run all films in window)'
        required: false
        type: string
      imdb_id:
        description: 'IMDb ID, e.g. tt1234567 (faster — skips TMDB lookup)'
        required: false
        type: string

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RT score agent
        env:
          TMDB_ACCESS_TOKEN:        ${{ secrets.TMDB_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          FILM_TITLE:               ${{ inputs.film_title }}
          IMDB_ID:                  ${{ inputs.imdb_id }}
        run: node agent/fetch-rt-scores.js
